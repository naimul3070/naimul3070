<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" preserveAspectRatio="none">
<defs><linearGradient id="r" x1="0" x2="1" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".25" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#f472b6"/><stop offset=".75" stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/>
