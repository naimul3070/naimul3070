<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="1" stop-color="#0d1b36"/></linearGradient>
 <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
 </linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16264a" stroke-width="1"/></pattern>
 <radialGradient id="halo"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="sub"><rect x="60" y="180" height="40" width="0"><animate attributeName="width" values="0;480" dur="2.4s" begin="1.6s" fill="freeze"/></rect></clipPath>
 <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
</defs>
<style>
 .name{font:800 66px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:1px;fill:url(#ink);stroke:url(#ink);stroke-width:1.4;
   fill-opacity:0;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s ease-out forwards, fill 1s 1.6s forwards}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes fill{to{fill-opacity:1}}
 .sub{font:500 22px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#c7d7f5}
 .tag{font:600 13px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#8fb3ff;opacity:0;animation:fadeup .8s ease forwards}
 @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 .chip{font:700 13px 'JetBrains Mono',Consolas,'Courier New',monospace}
 .spin{transform-origin:800px 160px;animation:spin 24s linear infinite}
 .spinr{transform-origin:800px 160px;animation:spin 16s linear infinite reverse}
 @keyframes spin{to{transform:rotate(360deg)}}
 .pulse{transform-origin:800px 160px;animation:pulse 3s ease-in-out infinite}
 @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
 .dot{animation:float 6s ease-in-out infinite}
 @keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
 .cursor{animation:blink 1s steps(1) infinite}
 @keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="320" fill="url(#bg)"/>
<g><rect x="-40" y="-40" width="1080" height="400" fill="url(#grid)"/>
 <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="4s" repeatCount="indefinite"/></g>
<rect y="0" width="260" height="320" fill="url(#scan)"><animate attributeName="x" values="-260;1000" dur="5s" repeatCount="indefinite"/></rect>
<circle class="dot" cx="351" cy="219" r="2" fill="#22d3ee" style="animation-delay:3.91s"/>
<circle class="dot" cx="860" cy="268" r="1.5" fill="#22d3ee" style="animation-delay:2.19s"/>
<circle class="dot" cx="951" cy="264" r="1.5" fill="#8b5cf6" style="animation-delay:0.22s"/>
<circle class="dot" cx="448" cy="208" r="1.5" fill="#8b5cf6" style="animation-delay:0.54s"/>
<circle class="dot" cx="80" cy="305" r="2.5" fill="#22d3ee" style="animation-delay:0.74s"/>
<circle class="dot" cx="665" cy="280" r="2.5" fill="#34d399" style="animation-delay:5.69s"/>
<circle class="dot" cx="619" cy="250" r="1.5" fill="#22d3ee" style="animation-delay:5.86s"/>
<circle class="dot" cx="590" cy="309" r="1.5" fill="#22d3ee" style="animation-delay:1.74s"/>
<circle class="dot" cx="573" cy="215" r="2.5" fill="#34d399" style="animation-delay:1.85s"/>
<circle class="dot" cx="205" cy="213" r="2.5" fill="#22d3ee" style="animation-delay:3.43s"/>
<circle class="dot" cx="401" cy="212" r="2.5" fill="#34d399" style="animation-delay:4.27s"/>
<circle class="dot" cx="81" cy="279" r="1.5" fill="#34d399" style="animation-delay:2.98s"/>
<circle class="dot" cx="457" cy="299" r="2" fill="#8b5cf6" style="animation-delay:2.79s"/>
<circle class="dot" cx="390" cy="238" r="1.5" fill="#34d399" style="animation-delay:4.77s"/>
<circle class="dot" cx="818" cy="231" r="1.5" fill="#34d399" style="animation-delay:3.45s"/>
<circle class="dot" cx="526" cy="312" r="2" fill="#8b5cf6" style="animation-delay:4.38s"/>
<circle class="dot" cx="643" cy="209" r="1.5" fill="#22d3ee" style="animation-delay:3.07s"/>
<circle class="dot" cx="795" cy="243" r="1.5" fill="#8b5cf6" style="animation-delay:5.6s"/>

<text x="60" y="140" class="name">Naimul Islam</text>
<g clip-path="url(#sub)"><text x="60" y="208" class="sub">&gt; DevOps Engineer × AI Automation</text></g>
<rect class="cursor" x="60" y="190" width="12" height="22" fill="#22d3ee"><animate attributeName="x" values="60;530" dur="2.4s" begin="1.6s" fill="freeze"/></rect>
<text x="60" y="258" class="tag" style="animation-delay:4s">AWS / AZURE / GCP   ·   KUBERNETES   ·   TERRAFORM   ·   CI/CD</text>
<text x="60" y="284" class="tag" style="animation-delay:4.4s;fill:#34d399">● 5+ yrs DevOps  ● 9+ yrs IT  ● 99.99% uptime  ● HIPAA-ready</text>

<circle cx="800" cy="160" r="120" fill="url(#halo)"/>
<g class="spin"><circle cx="800" cy="160" r="105" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 10"/></g>
<g class="spinr"><circle cx="800" cy="160" r="72" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="2" stroke-dasharray="40 14"/></g>
<g class="pulse" filter="url(#glow)">
 <circle cx="800" cy="160" r="40" fill="#0d1b36" stroke="url(#ink)" stroke-width="3"/>
 <text x="800" y="168" text-anchor="middle" style="font:800 22px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#e6f1ff">AI</text>
</g>
<g><rect x="-22.5" y="-12" width="45" height="24" rx="12" fill="#0a1426" stroke="#ff9900" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" class="chip" fill="#ff9900">AWS</text>
 <animateMotion dur="10s" begin="-0.0s" repeatCount="indefinite" path="M905,160 a105,105 0 1,1 -210,0 a105,105 0 1,1 210,0"/></g>
<g><rect x="-22.5" y="-12" width="45" height="24" rx="12" fill="#0a1426" stroke="#3b82f6" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" class="chip" fill="#3b82f6">K8s</text>
 <animateMotion dur="10s" begin="-3.33s" repeatCount="indefinite" path="M905,160 a105,105 0 1,1 -210,0 a105,105 0 1,1 210,0"/></g>
<g><rect x="-18.0" y="-12" width="36" height="24" rx="12" fill="#0a1426" stroke="#a78bfa" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" class="chip" fill="#a78bfa">TF</text>
 <animateMotion dur="10s" begin="-6.67s" repeatCount="indefinite" path="M905,160 a105,105 0 1,1 -210,0 a105,105 0 1,1 210,0"/></g>
<g><rect x="-18.0" y="-12" width="36" height="24" rx="12" fill="#0a1426" stroke="#34d399" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" class="chip" fill="#34d399">CI</text>
 <animateMotion dur="7s" begin="-0.0s" repeatCount="indefinite" path="M872,160 a72,72 0 1,1 -144,0 a72,72 0 1,1 144,0"/></g>
<g><rect x="-22.5" y="-12" width="45" height="24" rx="12" fill="#0a1426" stroke="#22d3ee" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" class="chip" fill="#22d3ee">SRE</text>
 <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M872,160 a72,72 0 1,1 -144,0 a72,72 0 1,1 144,0"/></g>
<rect x="1" y="1" width="998" height="318" rx="18" fill="none" stroke="url(#ink)" stroke-opacity=".6" stroke-width="2"/>
</g></svg>