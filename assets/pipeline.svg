<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
<defs>
 <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .flow{stroke-dasharray:8 10;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-18}}
 .lbl{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#c7d7f5} .ic{font:700 18px 'JetBrains Mono',Consolas,'Courier New',monospace}
 .ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite;opacity:0}
 @keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
 .ttl{font:700 12px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#5d7aa8;letter-spacing:3px}
</style>
<rect width="1000" height="200" rx="16" fill="#070d1a" stroke="#1e3a6e"/>
<text x="24" y="28" class="ttl">HOW I SHIP: AI-ASSISTED DELIVERY PIPELINE</text>
<path d="M90 95 H910" stroke="#1e3a6e" stroke-width="4"/>
<path id="track" d="M90 95 H910" stroke="url(#ln)" stroke-width="3" class="flow" fill="none"/>
<circle class="ring" cx="90" cy="95" r="28" fill="none" stroke="#22d3ee" stroke-width="2" style="animation-delay:0.0s"/>
<circle cx="90" cy="95" r="28" fill="#0d1830" stroke="#22d3ee" stroke-width="2.5"/>
<text x="90" y="101" text-anchor="middle" class="ic" fill="#22d3ee">&lt;/&gt;</text>
<text x="90" y="151" text-anchor="middle" class="lbl">Code</text>
<circle class="ring" cx="254" cy="95" r="28" fill="none" stroke="#8b5cf6" stroke-width="2" style="animation-delay:0.5s"/>
<circle cx="254" cy="95" r="28" fill="#0d1830" stroke="#8b5cf6" stroke-width="2.5"/>
<text x="254" y="101" text-anchor="middle" class="ic" fill="#8b5cf6">AI</text>
<text x="254" y="151" text-anchor="middle" class="lbl">AI review</text>
<circle class="ring" cx="418" cy="95" r="28" fill="none" stroke="#3b82f6" stroke-width="2" style="animation-delay:1.0s"/>
<circle cx="418" cy="95" r="28" fill="#0d1830" stroke="#3b82f6" stroke-width="2.5"/>
<text x="418" y="101" text-anchor="middle" class="ic" fill="#3b82f6">⚙</text>
<text x="418" y="151" text-anchor="middle" class="lbl">Build</text>
<circle class="ring" cx="582" cy="95" r="28" fill="none" stroke="#34d399" stroke-width="2" style="animation-delay:1.5s"/>
<circle cx="582" cy="95" r="28" fill="#0d1830" stroke="#34d399" stroke-width="2.5"/>
<text x="582" y="101" text-anchor="middle" class="ic" fill="#34d399">✔</text>
<text x="582" y="151" text-anchor="middle" class="lbl">Test</text>
<circle class="ring" cx="746" cy="95" r="28" fill="none" stroke="#fbbf24" stroke-width="2" style="animation-delay:2.0s"/>
<circle cx="746" cy="95" r="28" fill="#0d1830" stroke="#fbbf24" stroke-width="2.5"/>
<text x="746" y="101" text-anchor="middle" class="ic" fill="#fbbf24">⇪</text>
<text x="746" y="151" text-anchor="middle" class="lbl">Deploy</text>
<circle class="ring" cx="910" cy="95" r="28" fill="none" stroke="#f472b6" stroke-width="2" style="animation-delay:2.5s"/>
<circle cx="910" cy="95" r="28" fill="#0d1830" stroke="#f472b6" stroke-width="2.5"/>
<text x="910" y="101" text-anchor="middle" class="ic" fill="#f472b6">◉</text>
<text x="910" y="151" text-anchor="middle" class="lbl">Monitor</text>
<g filter="url(#g)"><circle r="7" fill="#ffffff"/><circle r="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
<animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#track"/></animateMotion></g>
</svg>